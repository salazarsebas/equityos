[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# Compiler: pinned so local and CI builds produce identical bytecode.
solc_version = "0.8.39"
# Base mainnet and Base Sepolia execute Prague opcodes since the Isthmus upgrade.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "all"
sort_imports = true
