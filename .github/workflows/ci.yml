name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Statement and branch coverage of packages/core/src, at least 95% each. Bun's own coverage reports neither,
      # so the sources are instrumented with Istanbul by a test preload.
      - name: Core coverage
        run: bun run test:coverage:core

      - name: Build
        run: bun run build

      # The fonts are self-hosted: the build and the pages must not reference a Google Fonts host.
      - name: Check for Google Fonts references
        run: |
          if grep -rIlE 'fonts\.(googleapis|gstatic)\.com' apps/web/src apps/web/.next; then
            echo "Google Fonts host referenced in the files above: self-host the font with next/font/local."
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Smoke test
        run: bun run test:e2e

      # Mobile Lighthouse on the landing page, the explorer and an index page, with the replayed data: performance
      # at least 95, the other categories 100, LCP, CLS and TBT under their ceilings. See
      # docs/development/performance.md.
      - name: Lighthouse budgets
        run: bun run test:lighthouse

      # Mutation score of packages/core, at least 80%. Stryker's Bun runner needs Bun 1.4, so these steps come last:
      # the second setup replaces the Bun used above. Only the mutants whose code or covering tests changed since
      # tools/mutation/incremental.json are tested again.
      - name: Setup Bun for mutation testing
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Mutation testing
        run: bun run test:mutation

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      - name: Show Foundry version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # Fails if a measured gas figure differs from the committed contracts/snapshots.
      - name: Test
        run: forge test -vvv
        env:
          FORGE_SNAPSHOT_CHECK: true

      # Sends the deployment transactions to a local Anvil node, with an unlocked development account.
      - name: Deploy to a local node
        run: ./test/deploy-local.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Line and branch coverage of every file under src/, at least 95% each. Coverage builds without the
      # optimizer, so the tests that assert facts about the optimized bytecode (code hashes, opcodes, gas) are left
      # out. It runs after the local deployment for the same reason: it rebuilds the artifacts.
      - name: Coverage
        run: >-
          mkdir -p coverage &&
          forge coverage --report summary --report lcov --report-file coverage/lcov.info
          --no-match-path "test/{Deploy,Bytecode,IndexRegistry.gas}.t.sol" --no-match-coverage "^(test|script)/"
        env:
          FOUNDRY_PROFILE: default

      - name: Check coverage
        run: bun ../scripts/check-contracts-coverage.ts coverage/lcov.info

      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6

      # Aderyn is retired and its release binaries were withdrawn, so it is built from the source of the last
      # release, pinned by commit, and cached. That source still carries a `#![feature]` attribute for an API that
      # is stable since Rust 1.98, which the stable compiler rejects: RUSTC_BOOTSTRAP accepts it.
      # The build takes about five minutes. The cache is saved right after it, so a later failing step does not
      # discard it.
      - name: Restore Aderyn
        id: aderyn-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/aderyn
          key: aderyn-a288420403cb1ae5f38ce606c3a6d4e605b9c81d-${{ runner.os }}

      - name: Build Aderyn
        if: steps.aderyn-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/Cyfrin/aderyn --rev a288420403cb1ae5f38ce606c3a6d4e605b9c81d aderyn
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Save Aderyn
        if: steps.aderyn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/aderyn
          key: aderyn-a288420403cb1ae5f38ce606c3a6d4e605b9c81d-${{ runner.os }}

      # Both reports are compared with the reviewed baseline: a new, changed or fixed finding fails the job, and
      # no High or Medium finding is accepted unless it is shown to be a false positive.
      - name: Static analysis
        run: |
          slither . --config-file slither.config.json --json "$RUNNER_TEMP/slither.json" > /dev/null
          ~/.cargo/bin/aderyn . --output "$RUNNER_TEMP/aderyn.json"
          bun ../scripts/check-static-analysis.ts --baseline static-analysis/baseline.json \
            --slither "$RUNNER_TEMP/slither.json" --aderyn "$RUNNER_TEMP/aderyn.json"

  # The contracts and the TypeScript that reads them, together: needs both Foundry and Bun.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps --only-shell chromium

      # Builds the contracts, fails if the committed ABI modules differ from the build artifacts, then runs the
      # deployment script, the seed and the registry reader against a local Anvil node. Last, it publishes an
      # index from the Studio in a browser against a second local node. Every transaction goes to chain 31337.
      - name: Integration test
        run: bun run test:integration
